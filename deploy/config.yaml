server:
  addr: ":8080"
  client_tokens:
    - "${TODO2API_CLIENT_TOKEN}"

storage:
  path: "/data/todo2api.db"
  master_key: "${TODO2API_MASTER_KEY}"

web:
  admin_username: "${TODO2API_ADMIN_USERNAME}"
  admin_password: "${TODO2API_ADMIN_PASSWORD}"
  session_ttl: 12h
  secure_cookie: true
  trusted_proxies:
    - "${TODO2API_PROXY_CIDR}"

upstream:
  base_url: "https://api.todofor.ai/api/v1"
  poll_timeout: 5m

pool:
  strategy: "round_robin"
  key_files: []
  keys: []

models:
  default: "openai:openai/gpt-5.6-sol"
  aliases:
    gpt-5.6-sol: "openai:openai/gpt-5.6-sol"
  free_account_models:
    - "claude-haiku-4.5"
    - "claude-sonnet-5"

edge:
  enabled: false
  edge_id: ""
  allow_tools: []

tool_protocol:
  deny_upstream_tools:
    - "device:*"
    - "cloud:*"
