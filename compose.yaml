services:
  todo2api:
    build:
      context: .
    image: "todo2api:${TODO2API_IMAGE_TAG:-dev}"
    container_name: todo2api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${TODO2API_BIND_IP:-172.17.0.1}:${TODO2API_HOST_PORT:-18086}:8080"
    volumes:
      - "./deploy/config.yaml:/config/config.yaml:ro"
      - "./data:/data"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - todo2api

networks:
  todo2api:
    name: todo2api
    driver: bridge
    ipam:
      config:
        - subnet: 10.242.0.0/24
          gateway: 10.242.0.1
